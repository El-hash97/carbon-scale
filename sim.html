/* HUD chrome shared by every sim. 1rem = 10px at the 1080x1350 reference
   size; runtime sets html font-size from the viewport so it scales. */

:root {
  --bg: #09090a;
  --fg: #ece6d6;
  --dim: rgba(236, 230, 214, 0.64);
  --mute: rgba(236, 230, 214, 0.38);
  --faint: rgba(236, 230, 214, 0.16);
  --line: rgba(236, 230, 214, 0.14);
  --panel: rgba(9, 9, 10, 0.9);
  --accent: #f2b632;
  --top: 13.4rem;
  --bot: 30.5rem;
}
:root[data-theme='light'] {
  --bg: #f3f2ee;
  --fg: #151515;
  --dim: rgba(21, 21, 21, 0.66);
  --mute: rgba(21, 21, 21, 0.42);
  --faint: rgba(21, 21, 21, 0.16);
  --line: rgba(21, 21, 21, 0.16);
  --panel: rgba(243, 242, 238, 0.93);
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
#app {
  position: fixed; inset: 0; color: var(--fg);
  font-family: 'JetBrains Mono', ui-monospace, monospace;
  font-variant-ligatures: none; -webkit-font-smoothing: antialiased;
}
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.hud { position: absolute; inset: 0; pointer-events: none; }
.hud.hidden { display: none; }
.accent { color: var(--accent); }

/* header */
.hdr {
  position: absolute; left: 0; right: 0; top: 0; height: var(--top);
  padding: 2.4rem 2.8rem 0;
  background: linear-gradient(var(--bg) 0%, var(--bg) 78%, transparent 100%);
}
.row { display: flex; align-items: baseline; white-space: nowrap; }
.row1 { gap: 5.6rem; }
.title { display: flex; align-items: center; gap: 1.3rem; font-size: 3.6rem; font-weight: 600; letter-spacing: 0.04em; }
.title .bar { display: inline-block; width: 0.75rem; height: 3.6rem; background: var(--accent); }
.sub { font-size: 1.75rem; color: var(--dim); letter-spacing: 0.08em; }
.right { margin-left: auto; font-size: 1.6rem; color: var(--dim); letter-spacing: 0.1em; }
.row2 { margin-top: 2rem; font-size: 1.95rem; }
.row2 .stage { width: 21rem; letter-spacing: 0.05em; }
.row2 .cmd { color: var(--fg); }
.row2 .time { margin-left: auto; letter-spacing: 0.05em; }
.prog { position: absolute; left: 2.8rem; right: 2.8rem; bottom: 1.2rem; height: 0.35rem; }
.prog i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); }

/* viewport overlays */
.ann { position: absolute; inset: 0; overflow: hidden; }
.ann div {
  position: absolute; transform: translate(1.4rem, -50%); white-space: nowrap;
  font-size: 1.7rem; letter-spacing: 0.04em; color: var(--fg);
  text-shadow: 0 0 0.6rem var(--bg), 0 0 1.2rem var(--bg);
}
.ann div.a { color: var(--accent); }
.ann div.box {
  padding: 0.8rem 1.1rem; border: 1px solid var(--line); background: var(--panel);
  text-shadow: none; line-height: 1.45; font-size: 1.55rem;
}
.ann div.box b { color: var(--accent); font-weight: 600; }
.wm {
  position: absolute; right: 3rem; bottom: calc(var(--bot) + 1.6rem);
  font-size: 2.3rem; letter-spacing: 0.06em; color: var(--fg); opacity: 0.3;
}

/* bottom panel */
.bot {
  position: absolute; left: 0; right: 0; bottom: 0; height: var(--bot);
  display: flex; border-top: 1px solid var(--line); background: var(--panel);
  padding: 2rem 2.8rem 1.6rem;
}
.term { flex: 1; min-width: 0; display: flex; flex-direction: column; padding-right: 2.6rem; }
.thead { display: flex; align-items: baseline; gap: 2.4rem; font-size: 1.75rem; white-space: nowrap; }
.thead .host { font-size: 2.1rem; }
.thead .path { color: var(--dim); }
.thead .status { margin-left: auto; font-size: 1.5rem; letter-spacing: 0.1em; display: flex; align-items: center; gap: 0.9rem; }
.thead .status i { width: 1rem; height: 1rem; border-radius: 50%; background: var(--accent); display: inline-block; }
.prompt { margin-top: 1.9rem; font-size: 2.2rem; white-space: nowrap; overflow: hidden; }
.logs { margin-top: 1.1rem; font-size: 1.85rem; line-height: 1.52; flex: 1; overflow: hidden; }
.logs div { white-space: nowrap; overflow: hidden; text-overflow: clip; }
.logs .ln { color: var(--mute); display: inline-block; width: 6.4rem; }
.logs .hl { color: var(--accent); }
.caret { display: inline-block; width: 0.95em; height: 1.05em; vertical-align: -0.15em; background: var(--accent); margin-left: 0.15em; }
.tfoot { font-size: 1.35rem; color: var(--mute); white-space: nowrap; letter-spacing: 0.04em; }
.side {
  width: 31%; border-left: 1px solid var(--line); padding-left: 2.2rem;
  display: flex; flex-direction: column;
}
.shead { font-size: 1.45rem; letter-spacing: 0.12em; }
.mini { width: 100%; flex: 1; min-height: 0; display: block; margin: 0.8rem 0; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem 1.4rem; font-size: 1.35rem; color: var(--mute); }
.stats b { display: block; font-size: 2rem; color: var(--fg); font-weight: 600; letter-spacing: 0.02em; }
.sfoot { margin-top: 0.8rem; font-size: 1.3rem; color: var(--mute); letter-spacing: 0.05em; }
.baseline { position: absolute; left: 2.8rem; right: 2.8rem; bottom: 0.9rem; height: 0.25rem; background: var(--line); }
.baseline i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); }

/* director layers */
.dir-glitch { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.dir-flash {
  position: absolute; inset: 0; pointer-events: none; opacity: 0; mix-blend-mode: screen;
  background: radial-gradient(ellipse 75% 55% at 50% 45%, var(--accent) 0%, transparent 70%), rgba(255,255,255,0.18);
}
.dir-story {
  position: absolute; left: 0; right: 0; top: 0; bottom: 0; pointer-events: none;
  display: flex; align-items: flex-end; justify-content: center; padding: 0 4.5rem 6rem; opacity: 0;
}
.cap { text-align: center; max-width: 96rem; position: relative; }
.cap::before {
  content: ''; position: absolute; inset: -6rem -10rem; z-index: -1;
  background: radial-gradient(ellipse 50% 50% at 50% 55%, rgba(0,0,0,0.62) 0%, rgba(0,0,0,0) 100%);
}
:root[data-theme='light'] .cap::before { background: radial-gradient(ellipse 50% 50% at 50% 55%, rgba(243,242,238,0.8) 0%, rgba(243,242,238,0) 100%); }
.cap-main {
  font-family: 'Inter', 'Inter Variable', system-ui, sans-serif; font-weight: 800;
  font-size: 11.5rem; line-height: 0.98; letter-spacing: -0.035em; color: var(--fg);
  text-shadow: 0 0.4rem 2.4rem rgba(0,0,0,0.55);
}
.cap.num .cap-main { font-size: 15rem; font-variant-numeric: tabular-nums; letter-spacing: -0.045em; }
.cap-main .w { display: inline-block; transform-origin: 50% 70%; }
.cap-main .w.hl { background: var(--accent); color: #0a0a0a; padding: 0 0.14em; text-shadow: none; border-radius: 0.06em; }
.cap-sub {
  margin-top: 2rem; font-size: 2.7rem; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--fg); opacity: 0.85; min-height: 1.3em;
}
.cap-tag {
  display: inline-block; margin-bottom: 1.8rem; padding: 0.5rem 1.2rem; font-size: 2.2rem; letter-spacing: 0.12em;
  border: 1px solid var(--accent); color: var(--accent); background: rgba(0,0,0,0.5);
}

:root { --ink: #1d1c1a; --dim: #6c685f; --line: #d9d5cb; --panel: rgba(250, 249, 246, 0.94); --acc: #e8572a; --ok: #2b8c45; }
html, body { background: #ecebe6; }
#app { position: absolute !important; inset: auto !important; left: 0; top: 0; width: 1600px; height: 900px; transform-origin: 0 0; color: var(--ink); font-family: 'JetBrains Mono', monospace; }
#gl { position: absolute; inset: 0; width: 1600px; height: 900px; touch-action: none; cursor: grab; }
#leads { position: absolute; left: 0; top: 0; pointer-events: none; }
#labels { position: absolute; inset: 0; pointer-events: none; }
.lb { position: absolute; left: 0; top: 0; padding: 5px 9px; background: rgba(255, 255, 255, 0.92); border: 1px solid var(--line); border-radius: 4px; font: 600 13px 'JetBrains Mono', monospace; white-space: nowrap; }
.hd { position: absolute; left: 28px; top: 20px; pointer-events: none; }
.t1 { font: 700 22px Inter, sans-serif; letter-spacing: 0.5px; }
.t1 span { color: var(--dim); font-weight: 500; }
.t2 { margin-top: 4px; font-size: 12px; color: var(--dim); }
.pn { position: absolute; top: 92px; width: 310px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px; }
.left { left: 20px; }
.right { right: 20px; width: 370px; padding: 12px 14px; }
.h { font: 700 11px 'JetBrains Mono', monospace; letter-spacing: 1.4px; color: var(--dim); }
.h b { color: var(--acc); }
.h2 { margin-top: 12px; }
.big { margin: 8px 0 10px; font: 700 46px Inter, sans-serif; color: var(--acc); font-variant-numeric: tabular-nums; }
.big small { font: 500 14px 'JetBrains Mono', monospace; color: var(--dim); }
/* the gate controller */
.gates { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
.gt { display: flex; align-items: center; justify-content: space-between; font-size: 12px; font-weight: 600; }
.gt small { font-weight: 400; color: var(--dim); font-size: 11px; }
.gt .bt { min-width: 92px; padding: 5px 9px; }
.gt .bt.on { background: var(--acc); border-color: var(--acc); }
/* live charts */
.chart { display: block; width: 100%; height: 84px; margin-top: 2px; }
.chart text, .sch text { letter-spacing: 0; }
.chart .axg { stroke: #e4e1d9; }
.chart .ax0 { stroke: #9b978e; stroke-dasharray: 3 3; }
.chart .axt { font: 500 8px 'JetBrains Mono', monospace; fill: var(--dim); text-anchor: middle; }
.chart .axt.r { text-anchor: end; }
.chart .axt.l { text-anchor: start; }
.chart .ln { fill: none; stroke: var(--ok); stroke-width: 1.2; opacity: 0.4; }
.chart .ln.o { stroke: var(--acc); stroke-dasharray: 4 3; }
.chart .ln.on { opacity: 1; stroke-width: 2; }
.chart .mk { stroke: var(--acc); stroke-dasharray: 2 2; }
.chart .mk-t { fill: var(--acc); }
.chart .dot { fill: var(--acc); stroke: #fff; stroke-width: 1.5; }
/* the schematic (front view in mm, mechanism zoomed) */
.sch { display: block; width: 100%; }
#sch { height: 370px; }
#mch { height: 196px; }
.sch * { vector-effect: non-scaling-stroke; }
.sf { fill: #dedbd3; }
.sd { fill: #4d5157; }
.ss { fill: #dfe2e5; stroke: #6c685f; stroke-width: 1; }
.sfr { fill: #aeb3b8; }
.sc { fill: #1d1e21; }
.sl { stroke: #6c685f; }
.sg { fill: #c9cdd2; stroke: #6c685f; }
.sg.on { stroke: var(--acc); stroke-width: 2; }
.sst { stroke: #1d1e21; stroke-width: 3; stroke-dasharray: 4 3; }
.sgr { fill: #2f9d5a; }
.sdl { fill: #f6f6f2; stroke: #8d939a; stroke-width: 2; }
.snd { stroke: var(--acc); stroke-width: 2; }
.sk { fill: #8d939a; }
.so { fill: #dfe2e5; stroke: var(--acc); stroke-width: 1.5; }
.scr { fill: rgba(43, 140, 69, 0.22); stroke: var(--ok); stroke-width: 2; }
.st-t { font: 600 44px 'JetBrains Mono', monospace; fill: var(--ink); text-anchor: middle; }
.st-t.big { font: 800 90px Inter, sans-serif; }
.st-t.acc { fill: var(--acc); }
.msp { fill: none; stroke: #5c636b; stroke-width: 1.4; }
.mfx { fill: #8d939a; }
.mst { stroke: #8d939a; stroke-width: 2; }
.mlv { stroke: #6c685f; stroke-width: 3; }
.mpv, .mrk { fill: #c8a048; }
.mpn { fill: #c8a048; stroke: #8a6d2a; }
.mnd { stroke: var(--acc); stroke-width: 2; }
.mt { font: 500 6.4px 'JetBrains Mono', monospace; fill: var(--dim); }
.mt.acc { fill: var(--acc); }
/* subsystem row */
.ft2 { position: absolute; left: 20px; bottom: 80px; display: flex; gap: 10px; align-items: center; }
.ft2 .lbl { font-size: 11px; letter-spacing: 1.4px; color: var(--dim); }
.ft2 .hint { font-size: 10.5px; color: var(--dim); }
.tabs { display: flex; gap: 6px; margin-bottom: 10px; }
.sub { margin: 10px 0 4px; font-size: 11px; color: var(--dim); }
.sub b { color: var(--acc); }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.bt.ch { padding: 5px 7px; font-size: 10.5px; line-height: 1.3; text-align: left; }
.bt.ch i { margin: 0; opacity: 0.6; }
#c-kg { width: 100%; margin: 2px 0 0; accent-color: var(--acc); pointer-events: auto; cursor: pointer; }
.ticks { display: flex; justify-content: space-between; font-size: 10px; color: var(--dim); }
.cbig { margin: 12px 0 6px; font: 700 30px Inter, sans-serif; color: var(--acc); font-variant-numeric: tabular-nums; }
.cbig small { display: block; margin-top: 2px; font: 500 11px 'JetBrains Mono', monospace; color: var(--dim); }
#c-sim { margin-top: 10px; }
.cmp tr.o td { color: var(--acc); font-weight: 700; }
.st { margin: 0 0 8px; padding: 6px 8px; font-size: 11px; line-height: 1.4; border-left: 3px solid var(--ok); background: #eaf4ec; }
.st.bad { border-left-color: var(--acc); background: #fbeee8; }
.rows .r { display: flex; justify-content: space-between; padding: 4px 0; border-top: 1px solid var(--line); font-size: 13px; }
.rows .r span { color: var(--dim); }
.rows .r b { font-variant-numeric: tabular-nums; }
.rows .r.acc b { color: var(--acc); }
.ctl { display: flex; align-items: center; gap: 12px; margin-top: 12px; }
.bt { pointer-events: auto; cursor: pointer; border: 1px solid var(--line); background: #fff; border-radius: 4px; font: 600 12px 'JetBrains Mono', monospace; color: var(--ink); padding: 7px 11px; }
.bt:hover { background: #f4f2ec; }
.bt.on { border-color: var(--ink); background: var(--ink); color: #fff; }
.bt i { font-style: normal; opacity: 0.55; margin-right: 6px; }
#play { width: 40px; }
.sl { position: relative; flex: 1; height: 26px; cursor: ew-resize; touch-action: none; }
.sl .tr { position: absolute; left: 0; right: 0; top: 11px; height: 4px; background: var(--line); border-radius: 2px; }
.sl .fl { height: 100%; background: var(--acc); border-radius: 2px; }
.sl .kn { position: absolute; top: 5px; width: 16px; height: 16px; margin-left: -8px; border-radius: 50%; background: #fff; border: 2px solid var(--acc); }
.note { margin-top: 10px; font-size: 11px; line-height: 1.5; color: var(--dim); }
/* the description drawings: top views in mm, one scale for all three (viewBox widths 1420 / 700 / 700) */
.dwg { display: block; }
#d-pallet { width: 100%; height: 84px; margin-top: 0; }
.dwg2 { display: flex; gap: 6px; }
.dwg2 .dwg { width: calc(50% - 3px); height: 122px; }
#pg-why .chk { font: 400 10.5px/1.35 Inter, sans-serif; letter-spacing: 0; }
.dwg * { vector-effect: non-scaling-stroke; }
.dwg text { font: 500 40px 'JetBrains Mono', monospace; fill: var(--dim); text-anchor: middle; letter-spacing: 0; }
.dwg .dt.l { text-anchor: start; }
.dwg .dt.b { font-weight: 700; fill: var(--ink); }
.dwg .dt.o { fill: var(--acc); }
.dwg .dt.g { fill: var(--ok); }
.dwg .dt.sm { font-size: 30px; }
.dm { fill: none; stroke: var(--ink); stroke-width: 1; }
.g-pal { fill: rgba(43, 140, 69, 0.18); stroke: var(--ok); stroke-width: 1.6; }
.g-pal2 { fill: none; stroke: var(--ok); stroke-width: 1.6; stroke-dasharray: 5 3; }
.g-in { fill: none; stroke: var(--ok); stroke-width: 1; stroke-dasharray: 3 3; }
.g-fill { fill: #1d1e21; }
.g-pan { fill: #dfe2e5; stroke: #6c685f; stroke-width: 1.2; }
.g-hang { fill: rgba(232, 87, 42, 0.22); }
.g-pin { fill: #c8a048; stroke: #6c685f; }
.g-pour { fill: var(--ink); }
.g-tray { fill: #dfe2e5; stroke: #6c685f; stroke-width: 1; }
.g-rail { fill: none; stroke: var(--ink); stroke-width: 3; }
.g-front { fill: none; stroke: #6c685f; stroke-width: 1; stroke-dasharray: 4 3; }
/* root cause / countermeasure */
.rc { margin-top: 5px; padding: 5px 8px 5px 10px; font: 400 11px/1.4 Inter, sans-serif; letter-spacing: 0; }
.rc.bad { background: #fbeee8; border-left: 3px solid var(--acc); }
.rc.good { background: #eaf4ec; border-left: 3px solid var(--ok); }
.rch { font: 700 10.5px 'JetBrains Mono', monospace; letter-spacing: 1px; margin-bottom: 2px; }
.rc.bad .rch, .rc.bad b { color: var(--acc); }
.rc.good .rch, .rc.good b { color: var(--ok); }
.rc ol { margin: 0; padding-left: 16px; }
.cmp table { width: 100%; border-collapse: collapse; font-size: 11px; margin-top: 4px; }
.cmp th { text-align: left; font-size: 10.5px; color: var(--dim); padding: 2px 0; }
.cmp td { padding: 3px 4px 3px 0; border-top: 1px solid var(--line); }
.cmp td:first-child { width: 118px; }
.cmp td:first-child { color: var(--dim); }
.cmp .o { color: var(--acc); }
.warn { margin-top: 8px; font-size: 11px; line-height: 1.45; color: var(--ink); background: #fbeee8; border-left: 3px solid var(--acc); padding: 6px 8px; }
.chk { margin-top: 4px; font-size: 10.5px; line-height: 1.5; }
.ft { position: absolute; left: 20px; right: 20px; bottom: 34px; display: flex; gap: 12px; align-items: center; }
.grp { display: flex; gap: 5px; }
.ft .bt { padding: 7px 8px; font-size: 11.5px; white-space: nowrap; }
.tour { margin-left: auto; display: flex; align-items: center; gap: 8px; letter-spacing: 1px; font-size: 11px; }
.tour i { display: block; width: 7px; height: 7px; border-radius: 50%; background: var(--acc); margin: 0; opacity: 1; }
.tour.on i { animation: blink 1.2s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0.15; } }
.src { position: absolute; left: 22px; bottom: 10px; font-size: 10.5px; color: var(--dim); }

/* the operator's cursor and its press */
#cur { position: absolute; left: 0; top: 0; z-index: 30; pointer-events: none; transform-origin: 4px 3px; filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.35)); }
#ring { position: absolute; z-index: 29; width: 54px; height: 54px; border: 2px solid var(--acc); border-radius: 50%; pointer-events: none; }
.bt.press { transform: scale(0.94); box-shadow: 0 0 0 3px rgba(232, 87, 42, 0.35); }
/* H: only the machine, its labels and the title */
.bare .pn, .bare .ft, .bare .ft2, .bare .src { display: none; }
.src b { color: var(--ink); }

</style>
